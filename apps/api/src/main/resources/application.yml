# 공통 API 설정: 운영 실행은 환경변수로 접속 정보 주입
spring:
  application:
    name: vtopia-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jooq:
    sql-dialect: POSTGRES

# 로컬 기본 포트와 오류 상세 비공개
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# DB 상태를 포함한 health만 외부 노출
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
